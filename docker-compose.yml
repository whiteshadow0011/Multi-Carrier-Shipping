version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: carrier_postgres
    hostname: postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: carrier_gateway
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/db/docker-entrypoint.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - carrier_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d carrier_gateway"]
      interval: 3s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: carrier_redis
    hostname: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - carrier_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: carrier_api
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      PGUSER: postgres
      PGHOST: postgres
      PGDATABASE: carrier_gateway
      PGPASSWORD: postgrespassword
      PGPORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    networks:
      - carrier_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: carrier_worker
    restart: always
    command: ["npm", "run", "worker:dev"]
    environment:
      PGUSER: postgres
      PGHOST: postgres
      PGDATABASE: carrier_gateway
      PGPASSWORD: postgrespassword
      PGPORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    networks:
      - carrier_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: carrier_frontend
    restart: always
    ports:
      - "5173:5173"
    networks:
      - carrier_net
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:

networks:
  carrier_net:
    driver: bridge  